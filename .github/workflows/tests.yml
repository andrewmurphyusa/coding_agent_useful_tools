name: Tests

on:
  push:
  pull_request:

jobs:
  agentlog:
    name: agentlog / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # Windows environments may assume Python 3.13+; keep 3.11+ coverage on non-Windows.
        exclude:
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run agentlog tests
        working-directory: tools/agentlog
        run: python -m unittest discover -s tests
