[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog"
version = "0.1.0"
description = "Local analysis tools for coding-agent session logs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentlog = "agentlog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlog*"]
