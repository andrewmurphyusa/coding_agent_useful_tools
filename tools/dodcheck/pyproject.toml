[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dodcheck"
version = "0.1.0"
description = "Per-project definition-of-done checks for Claude Code hooks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dodcheck = "dodcheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dodcheck*"]
